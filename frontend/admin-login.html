<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | FitLife Studio</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body style="background-color: var(--color-forest-green); display: flex; align-items: center; justify-content: center; height: 100vh;">
  <div style="background: white; padding: 40px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);">
    <h2 style="color: var(--color-forest-green); margin-bottom: 8px; text-align: center;">Admin Portal</h2>
    <p style="color: #6b7280; font-size: 0.9rem; text-align: center; margin-bottom: 30px;">Authorized Access Only</p>
    
    <form id="login-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Login</button>
    </form>
    <div id="error-msg" style="color: red; font-size: 0.9rem; margin-top: 15px; text-align: center;"></div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      const res = await api.login(username, password);
      if (res.success) {
        localStorage.setItem('fitlife_token', res.token);
        window.location.href = 'admin-dashboard.html';
      } else {
        document.getElementById('error-msg').innerText = res.message || 'Invalid credentials';
      }
    });
  </script>
</body>
</html>
